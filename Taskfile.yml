version: "3"

vars:
  CTX: '{{.CTX | default "32768"}}'
  BACKEND: '{{.BACKEND | default "auto"}}'
  DEBUG: '{{.DEBUG | default ""}}'
  POWER: '{{.POWER | default ""}}'

env:
  # goffi's Linux/ARM64 dynamic-import stubs cannot use the CGO linker path.
  # Share purego's FFI runtime with goffi instead of linking two copies.
  CGO_ENABLED: '{{if eq OS "linux"}}0{{else}}{{.CGO_ENABLED | default "1"}}{{end}}'
  GOFLAGS: '{{.GOFLAGS | default ""}}{{if eq OS "linux"}} -tags=nofakecgo{{end}}'
  MODEL: '{{.MODEL | default ""}}'
  LIB: '{{.LIB | default ""}}'
  # Make the Go runtime re-raise fatal signals (e.g. the gogpu/Metal teardown
  # SIGSEGV) and abort instead of exiting cleanly, so a core dump is produced
  # when `ulimit -c` is non-zero. Use GOTRACEBACK=crash for full stacks + core.
  GOTRACEBACK: '{{.GOTRACEBACK | default "crash"}}'

tasks:
  default:
    desc: Build all the apps
    cmds:
      - task: build

  tidy:
    desc: Run go mod tidy
    run: once
    cmds:
      - go mod tidy

  build:
    desc: Build all TUI binaries to ./bin/
    cmds:
      - task: build:glyphpad
      - task: build:steering
      - task: build:svgpad
      - task: build:cadpad
      - task: build:trippad

  # Shared directives; each public build task gets its own checksum.
  build:glyphpad: &app-build
    desc: Build glyphpad binary
    requires:
      vars:
        - name: APP
          enum: [glyphpad, steering, svgpad, cadpad, trippad]
    method: checksum
    sources:
      - Taskfile.yml
      - go.mod
      - go.sum
      - go.work
      - go.work.sum
      - '{{.DS4GO_SOURCE_DIR}}/**/*.go'
      - '{{.DS4GO_SOURCE_DIR}}/go.mod'
      - '{{.DS4GO_SOURCE_DIR}}/go.sum'
      - 'cmd/{{.APP}}/**/*'
      - 'internal/**/*'
      - 'ntgpu/**/*'
    generates:
      - 'bin/ds4go-{{.APP}}'
      - '.task/build/{{.APP}}.config'
    vars:
      APP: glyphpad
      # `go list -m` reports an empty Dir until the module is in the cache,
      # which would turn the sources globs into `/**/*.go` and walk the whole
      # filesystem. Download first and fail loudly if it is still empty.
      DS4GO_SOURCE_DIR: &ds4go-source-dir
        sh: |
          set -eu
          dir=$(go list -m -f '{{"{{.Dir}}"}}' github.com/NimbleMarkets/ds4go)
          if [ -z "$dir" ]; then
            go mod download github.com/NimbleMarkets/ds4go >&2
            dir=$(go list -m -f '{{"{{.Dir}}"}}' github.com/NimbleMarkets/ds4go)
          fi
          if [ -z "$dir" ]; then echo "cannot resolve ds4go module dir" >&2; exit 1; fi
          printf '%s\n' "$dir"
      BUILD_CONFIG: &build-config
        sh: |
          set -eu
          build_env=$(go env -json GOOS GOARCH GOAMD64 GOARM GOARM64 GO386 GOPPC64 GORISCV64 GOMIPS GOMIPS64 GOWASM CGO_ENABLED GOFLAGS GOEXPERIMENT GOVERSION GOTOOLCHAIN GOROOT GOWORK GOENV CC CXX CGO_CFLAGS CGO_CPPFLAGS CGO_CXXFLAGS CGO_FFLAGS CGO_LDFLAGS PKG_CONFIG)
          build_revision=$(git rev-parse HEAD 2>/dev/null || true)
          build_status=clean
          if [ -n "$(git status --porcelain 2>/dev/null || true)" ]; then build_status=dirty; fi
          printf '%s\n' "$build_env" "$build_revision" "$build_status" | cksum
    # Sources alone cannot detect a changed target, toolchain, flags, or VCS
    # stamp. Compare with the configuration of the binary actually in bin/.
    status:
      - 'test -x bin/ds4go-{{.APP}}'
      - 'test "{{.BUILD_CONFIG}}" = "$(cat .task/build/{{.APP}}.config)"'
    cmds:
      - mkdir -p bin .task/build
      - go build -mod=readonly -o bin/ds4go-{{.APP}} ./cmd/{{.APP}}
      - "printf '%s\\n' '{{.BUILD_CONFIG}}' > .task/build/{{.APP}}.config"

  run:glyphpad:
    desc: Run the glyphpad TUI
    deps: [build:glyphpad]
    cmds:
      - |
        args="--backend {{.BACKEND}} --ctx {{.CTX}}"
        if [ -n "{{.MODEL}}" ]; then args="$args --model {{.MODEL}}"; fi
        if [ -n "{{.LIB}}" ]; then args="$args --lib {{.LIB}}"; fi
        if [ -n "{{.DEBUG}}" ]; then args="$args --debug"; fi
        if [ -n "{{.POWER}}" ]; then args="$args --power {{.POWER}}"; fi
        ./bin/ds4go-glyphpad $args

  build:steering:
    <<: *app-build
    desc: Build the steering binary
    vars:
      BUILD_CONFIG: *build-config
      DS4GO_SOURCE_DIR: *ds4go-source-dir
      APP: steering

  run:steering:
    desc: Run the steering TUI
    deps: [build:steering]
    cmds:
      - |
        args="--backend {{.BACKEND}} --ctx {{.CTX}}"
        if [ -n "{{.MODEL}}" ]; then args="$args --model {{.MODEL}}"; fi
        if [ -n "{{.LIB}}" ]; then args="$args --lib {{.LIB}}"; fi
        if [ -n "{{.DEBUG}}" ]; then args="$args --debug"; fi
        if [ -n "{{.POWER}}" ]; then args="$args --power {{.POWER}}"; fi
        ./bin/ds4go-steering $args

  build:svgpad:
    <<: *app-build
    desc: Build svgpad binary
    vars:
      BUILD_CONFIG: *build-config
      DS4GO_SOURCE_DIR: *ds4go-source-dir
      APP: svgpad

  run:svgpad:
    desc: Run the svgpad TUI
    deps: [build:svgpad]
    cmds:
      - |
        args="--backend {{.BACKEND}} --ctx {{.CTX}}"
        if [ -n "{{.MODEL}}" ]; then args="$args --model {{.MODEL}}"; fi
        if [ -n "{{.LIB}}" ]; then args="$args --lib {{.LIB}}"; fi
        if [ -n "{{.DEBUG}}" ]; then args="$args --debug"; fi
        if [ -n "{{.POWER}}" ]; then args="$args --power {{.POWER}}"; fi
        ./bin/ds4go-svgpad $args {{.CLI_ARGS}}

  build:cadpad:
    <<: *app-build
    desc: Build cadpad binary
    vars:
      BUILD_CONFIG: *build-config
      DS4GO_SOURCE_DIR: *ds4go-source-dir
      APP: cadpad

  run:cadpad:
    desc: Run the cadpad TUI (add NO_ENGINE=1 for pure geometry mode)
    deps: [build:cadpad]
    cmds:
      - |
        args="--backend {{.BACKEND}} --ctx {{.CTX}}"
        if [ -n "{{.MODEL}}" ]; then args="$args --model {{.MODEL}}"; fi
        if [ -n "{{.LIB}}" ]; then args="$args --lib {{.LIB}}"; fi
        if [ -n "{{.DEBUG}}" ]; then args="$args --debug"; fi
        if [ -n "{{.POWER}}" ]; then args="$args --power {{.POWER}}"; fi
        if [ -n "{{.NO_ENGINE}}" ]; then args="$args --no-engine"; fi
        ./bin/ds4go-cadpad $args

  build:trippad:
    <<: *app-build
    desc: Build trippad binary
    vars:
      BUILD_CONFIG: *build-config
      DS4GO_SOURCE_DIR: *ds4go-source-dir
      APP: trippad

  build:trippad-memory:
    desc: Build the engine-free scratchpad CLI
    cmds:
      - go build -o ./bin/ds4go-trippad-memory ./cmd/trippad-memory

  run:trippad:
    desc: Run the shader playground (add -- --no-engine for shaders only)
    deps: [build:trippad]
    cmds:
      - ./bin/ds4go-trippad {{.CLI_ARGS}}

  log:
    desc: Tail glyphpad.log, svgpad.log and cadpad.log in real time
    cmds:
      - touch glyphpad.log svgpad.log cadpad.log && tail -F glyphpad.log svgpad.log cadpad.log

  vet:
    desc: Run go vet for maintained app/library packages
    cmds:
      - go vet ./cmd/... ./internal/... ./ntgpu

  test:
    desc: Run Go tests for maintained app/library packages
    cmds:
      - go test ./cmd/... ./internal/... ./ntgpu

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Check formatting without modifying files (non-zero exit if unformatted)
    cmds:
      - cmd: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt: these files need formatting:"
            echo "$files"
            exit 1
          fi

  pre-push:
    desc: Verify formatting, build, and vet before pushing
    cmds:
      - go mod tidy
      - task: fmt-check
      - task: test
      - go build ./cmd/... ./internal/... ./ntgpu
      - task: vet

  clean:
    desc: Remove built binaries
    cmds:
      - rm -f ./bin/ds4go-glyphpad ./bin/ds4go-steering ./bin/ds4go-svgpad ./bin/ds4go-cadpad
