version: "3"

vars:
  CTX: '{{.CTX | default "32768"}}'
  BACKEND: '{{.BACKEND | default "metal"}}'
  DEBUG: '{{.DEBUG | default ""}}'
  POWER: '{{.POWER | default ""}}'

env:
  MODEL: '{{.MODEL | default ""}}'
  LIB: '{{.LIB | default ""}}'
  # Make the Go runtime re-raise fatal signals (e.g. the gogpu/Metal teardown
  # SIGSEGV) and abort instead of exiting cleanly, so a core dump is produced
  # when `ulimit -c` is non-zero. Use GOTRACEBACK=crash for full stacks + core.
  GOTRACEBACK: '{{.GOTRACEBACK | default "crash"}}'

tasks:
  default:
    desc: Build all the apps
    cmds:
      - task: build

  tidy:
    desc: Run go mod tidy
    run: once
    cmds:
      - go mod tidy

  build:
    desc: Build all TUI binaries to ./bin/
    deps: [tidy]
    cmds:
      - task: build:glyphpad
      - task: build:steering
      - task: build:svgpad
      - task: build:cadpad

  build:glyphpad:
    desc: Build glyphpad binary
    deps: [tidy]
    cmds:
      - go build -o ./bin/ds4go-glyphpad ./cmd/glyphpad

  run:glyphpad:
    desc: Run the glyphpad TUI
    deps: [build:glyphpad]
    cmds:
      - |
        args="--backend {{.BACKEND}} --ctx {{.CTX}}"
        if [ -n "{{.MODEL}}" ]; then args="$args --model {{.MODEL}}"; fi
        if [ -n "{{.LIB}}" ]; then args="$args --lib {{.LIB}}"; fi
        if [ -n "{{.DEBUG}}" ]; then args="$args --debug"; fi
        if [ -n "{{.POWER}}" ]; then args="$args --power {{.POWER}}"; fi
        ./bin/ds4go-glyphpad $args

  build:steering:
    desc: Build the steering binary
    deps: [tidy]
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - bin/ds4go-steering
    cmds:
      - go build -o bin/ds4go-steering ./cmd/steering

  run:steering:
    desc: Run the steering TUI
    deps: [build:steering]
    cmds:
      - |
        args="--backend {{.BACKEND}} --ctx {{.CTX}}"
        if [ -n "{{.MODEL}}" ]; then args="$args --model {{.MODEL}}"; fi
        if [ -n "{{.LIB}}" ]; then args="$args --lib {{.LIB}}"; fi
        if [ -n "{{.DEBUG}}" ]; then args="$args --debug"; fi
        if [ -n "{{.POWER}}" ]; then args="$args --power {{.POWER}}"; fi
        ./bin/ds4go-steering $args

  build:svgpad:
    desc: Build svgpad binary
    deps: [tidy]
    cmds:
      - go build -o ./bin/ds4go-svgpad ./cmd/svgpad

  run:svgpad:
    desc: Run the svgpad TUI
    deps: [build:svgpad]
    cmds:
      - |
        args="--backend {{.BACKEND}} --ctx {{.CTX}}"
        if [ -n "{{.MODEL}}" ]; then args="$args --model {{.MODEL}}"; fi
        if [ -n "{{.LIB}}" ]; then args="$args --lib {{.LIB}}"; fi
        if [ -n "{{.DEBUG}}" ]; then args="$args --debug"; fi
        if [ -n "{{.POWER}}" ]; then args="$args --power {{.POWER}}"; fi
        ./bin/ds4go-svgpad $args

  build:cadpad:
    desc: Build cadpad binary
    deps: [tidy]
    cmds:
      - go build -o ./bin/ds4go-cadpad ./cmd/cadpad

  run:cadpad:
    desc: Run the cadpad TUI (add NO_ENGINE=1 for pure geometry mode)
    deps: [build:cadpad]
    cmds:
      - |
        args="--backend {{.BACKEND}} --ctx {{.CTX}}"
        if [ -n "{{.MODEL}}" ]; then args="$args --model {{.MODEL}}"; fi
        if [ -n "{{.LIB}}" ]; then args="$args --lib {{.LIB}}"; fi
        if [ -n "{{.DEBUG}}" ]; then args="$args --debug"; fi
        if [ -n "{{.POWER}}" ]; then args="$args --power {{.POWER}}"; fi
        if [ -n "{{.NO_ENGINE}}" ]; then args="$args --no-engine"; fi
        ./bin/ds4go-cadpad $args

  log:
    desc: Tail glyphpad.log, svgpad.log and cadpad.log in real time
    cmds:
      - touch glyphpad.log svgpad.log cadpad.log && tail -F glyphpad.log svgpad.log cadpad.log

  vet:
    desc: Run go vet for maintained app/library packages
    cmds:
      - go vet ./cmd/... ./internal/... ./ntgpu

  test:
    desc: Run Go tests for maintained app/library packages
    cmds:
      - go test ./cmd/... ./internal/... ./ntgpu

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Check formatting without modifying files (non-zero exit if unformatted)
    cmds:
      - cmd: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt: these files need formatting:"
            echo "$files"
            exit 1
          fi

  pre-push:
    desc: Verify formatting, build, and vet before pushing
    cmds:
      - go mod tidy
      - task: fmt-check
      - task: test
      - go build ./cmd/... ./internal/... ./ntgpu
      - task: vet

  clean:
    desc: Remove built binaries
    cmds:
      - rm -f ./bin/ds4go-glyphpad ./bin/ds4go-steering ./bin/ds4go-svgpad
