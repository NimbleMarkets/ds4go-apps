name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full build + test on macOS — the only runner where cadpad's CGO/Metal path
  # compiles and where the gogpu GPU tests can run against a real device.
  macos:
    name: macOS build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gogpu trips the race detector's checkptr and SIGSEGVs on teardown, so the
      # render package is tested without -race; everything else keeps -race.
      - name: Test (race, excluding GPU render)
        run: |
          # shellcheck disable=SC2046 # intentional word-splitting of the package list
          go test -race $(go list ./... | grep -v 'internal/cadpad/render')

      - name: Test GPU render (no race)
        run: go test ./internal/cadpad/render

  # Pure-Go coverage + cross-compile sanity. Anything that transitively imports
  # gogpu (cadpad's GPU stack) needs cgo + Metal and can't build off-darwin, so
  # it is excluded here and covered by the macOS job instead.
  linux:
    name: Linux build and cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Pure-Go set = every package that does NOT transitively import gogpu.
      # This catches indirect importers (internal/cadpad/{harness,lua,tools}),
      # which a path grep would miss.
      - name: Compute pure-Go package set
        id: pkgs
        run: |
          list=$(for p in $(go list ./...); do
            go list -deps "$p" 2>/dev/null | grep -q 'gogpu/wgpu' || echo "$p"
          done | tr '\n' ' ')
          echo "pure-Go packages: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go build ${{ steps.pkgs.outputs.list }}

      - name: Vet
        run: go vet ${{ steps.pkgs.outputs.list }}

      # The race detector requires cgo, so this keeps the default CGO_ENABLED=1
      # (ubuntu ships gcc); these pure-Go packages don't actually use cgo.
      - name: Test (race)
        run: go test -race ${{ steps.pkgs.outputs.list }}

      # Release builds the pure-Go apps with CGO disabled; verify they
      # cross-compile to every shipped target. Windows is intentionally absent:
      # ds4go's purego path has no Dlsym there (matches the goreleaser goos list).
      - name: Cross-compile pure-Go apps (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: |
          for osarch in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS=${osarch%/*} GOARCH=${osarch#*/}
            echo "==> $GOOS/$GOARCH"
            go build -o /dev/null ./cmd/glyphpad ./cmd/svgpad ./cmd/steering
          done

  # Validate the release config so a broken .goreleaser.yaml is caught on PRs
  # rather than at tag time.
  goreleaser:
    name: Validate release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
