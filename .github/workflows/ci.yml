name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on every branch push: lint + build only, Linux-only, no tests
  # and no macOS minutes. The full suite below (macOS GPU tests, cross-compile,
  # goreleaser) is gated to PRs and main so work-in-progress pushes stay cheap.
  # Skipped on main pushes, where the full suite covers the same ground.
  validate:
    name: Validate (lint + build)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      # Pure-Go set = packages that do NOT transitively import gogpu (cgo + Metal,
      # darwin only) or go-gl (cgo + system GL/X11 headers the runner lacks; the
      # CAD packages reach it through gsdf). Same computation as the linux job.
      - name: Compute pure-Go package set
        id: pkgs
        run: |
          list=$(for p in $(go list ./...); do
            go list -deps -test "$p" 2>/dev/null | grep -qE 'gogpu/wgpu|go-gl/(gl|glfw)' || echo "$p"
          done | tr '\n' ' ')
          echo "pure-Go packages: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go build ${{ steps.pkgs.outputs.list }}

      - name: Vet
        run: go vet ${{ steps.pkgs.outputs.list }}

  # Full build + test on macOS — the only runner where cadpad's CGO/Metal path
  # compiles and where the gogpu GPU tests can run against a real device.
  macos:
    name: macOS build and test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The race detector is incompatible with gogpu — its Metal objc bridge
      # triggers checkptr violations and teardown SIGSEGVs. So ONLY the pure-Go
      # packages run under -race; every gogpu-dependent package (cmd/cadpad and
      # internal/cadpad/{render,harness,lua,tools}) is tested without it. Split
      # by actual dependency, not by path, to catch indirect importers.
      - name: Test pure-Go packages (race)
        run: |
          pkgs=$(for p in $(go list ./...); do
            go list -deps "$p" 2>/dev/null | grep -q 'gogpu/wgpu' || echo "$p"
          done)
          # shellcheck disable=SC2086 # intentional word-splitting of the package list
          go test -race $pkgs

      - name: Test gogpu packages (no race)
        run: |
          pkgs=$(for p in $(go list ./...); do
            go list -deps "$p" 2>/dev/null | grep -q 'gogpu/wgpu' && echo "$p"
          done)
          # shellcheck disable=SC2086 # intentional word-splitting of the package list
          go test $pkgs

  # Race coverage for non-GPU packages plus no-CGO Linux CAD build coverage.
  # Actual GPU rendering is tested on macOS and manually on a Linux/CUDA host.
  linux:
    name: Linux build and cross-compile
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Pure-Go set = every package that does NOT transitively import gogpu or
      # go-gl. This catches indirect importers (internal/cadpad/{harness,lua,
      # tools,world}), which a path grep would miss; -test also counts imports
      # made only by a package's tests. The excluded CAD packages
      # still get Linux coverage from the CGO-disabled compile step below.
      - name: Compute pure-Go package set
        id: pkgs
        run: |
          list=$(for p in $(go list ./...); do
            go list -deps -test "$p" 2>/dev/null | grep -qE 'gogpu/wgpu|go-gl/(gl|glfw)' || echo "$p"
          done | tr '\n' ' ')
          echo "pure-Go packages: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go build ${{ steps.pkgs.outputs.list }}

      - name: Vet
        run: go vet ${{ steps.pkgs.outputs.list }}

      # The race detector requires cgo, so this keeps the default CGO_ENABLED=1
      # (ubuntu ships gcc); these pure-Go packages don't actually use cgo.
      - name: Test (race)
        run: go test -race ${{ steps.pkgs.outputs.list }}

      # Linux CAD shares purego's FFI runtime with goffi. Building test binaries
      # also catches missing runtime symbols in isolated GPU packages.
      - name: Compile all Linux apps and tests
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-tags=nofakecgo"
        run: |
          for arch in amd64 arm64; do
            export GOARCH="$arch"
            go build ./cmd/... ./internal/... ./ntgpu
            go test -exec=true ./cmd/... ./internal/... ./ntgpu
          done

      # Release builds the pure-Go apps with CGO disabled; verify they
      # cross-compile to every shipped target. Windows is intentionally absent:
      # ds4go's purego path has no Dlsym there (matches the goreleaser goos list).
      - name: Cross-compile pure-Go apps (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: |
          for osarch in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS=${osarch%/*} GOARCH=${osarch#*/}
            echo "==> $GOOS/$GOARCH"
            go build -o /dev/null ./cmd/glyphpad ./cmd/svgpad ./cmd/steering
          done

  # Validate the release config so a broken .goreleaser.yaml is caught on PRs
  # rather than at tag time.
  goreleaser:
    name: Validate release config
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
